<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Keranjang | lapakID</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--purple:#465fff;--success:#12b76a;--warning:#f79009;--danger:#f04438;--legend:#eab308;--high:#f97316;--medium:#3b82f6;--low:#6b7280;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:800px;margin:0 auto;padding:80px 16px 100px;width:100%;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:26px;height:26px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-right{display:flex;align-items:center;gap:8px}
.saldo-chip{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--purple),#7592ff);border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:700;color:#fff;text-decoration:none}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 6px;border-radius:99px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.65rem}
.user-name{font-size:.65rem;font-weight:600;display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.55rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:180px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.1);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--text);font-size:.72rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}

.page-header{margin-bottom:20px}
.page-header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.3px}
.page-header p{color:var(--muted);font-size:.78rem;margin-top:4px}

.cart-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cart-item-left{flex:1;min-width:0}
.ci-id{font-size:.88rem;font-weight:700;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-tier{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.58rem;font-weight:700;margin-top:5px}
.ci-price{font-size:.8rem;font-weight:600;color:var(--muted);margin-top:3px}
.btn-remove{background:rgba(240,68,56,.1);color:var(--danger);border:none;border-radius:8px;padding:6px 12px;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-remove:hover{background:var(--danger);color:#fff}
.tb-low{background:rgba(107,114,128,.15);color:var(--low)}
.tb-medium{background:rgba(59,130,246,.15);color:var(--medium)}
.tb-high{background:rgba(249,115,22,.15);color:var(--high)}
.tb-legend{background:rgba(234,179,8,.15);color:var(--legend)}

.empty-state{text-align:center;padding:48px;color:var(--muted);font-size:.85rem}
.empty-state a{color:var(--purple);text-decoration:none;font-weight:600;display:block;margin-top:10px}

.checkout-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100;gap:12px}
.checkout-info{flex:1}
.checkout-count{font-size:.72rem;color:var(--muted)}
.checkout-total{font-size:1rem;font-weight:800;color:var(--text)}
.btn-checkout{background:var(--purple);color:#fff;border:none;border-radius:40px;padding:12px 24px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-checkout:hover{background:#3641f5;transform:translateY(-1px);box-shadow:0 4px 14px rgba(70,95,255,.3)}
.btn-checkout:disabled{opacity:.6;cursor:not-allowed;transform:none}
.saldo-info{font-size:.68rem;color:var(--muted);margin-top:2px}
.saldo-warn{color:var(--danger)}
.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}

/* SUCCESS MODAL */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;}
.modal.active{display:flex}
.modal-box{background:var(--card);border-radius:24px;max-width:480px;width:90%;max-height:85vh;overflow-y:auto;border:1px solid var(--border);padding:28px;}
.modal-title{font-size:1.2rem;font-weight:800;text-align:center;margin-bottom:4px}
.modal-sub{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:20px}
.result-card{background:var(--bg2);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.rc-id{font-size:.88rem;font-weight:700;font-family:var(--mono);margin-bottom:6px}
.rc-row{display:flex;justify-content:space-between;font-size:.72rem;padding:4px 0;border-bottom:1px solid var(--border)}
.rc-row:last-child{border-bottom:none}
.rc-label{color:var(--muted)}
.rc-val{font-weight:600;font-family:var(--mono)}
.btn-copy{background:var(--purple);color:#fff;border:none;border-radius:40px;padding:10px 20px;font-size:.78rem;font-weight:600;cursor:pointer;margin-top:6px;width:100%}
.btn-done{background:var(--success);color:#fff;border:none;border-radius:40px;padding:12px;font-size:.88rem;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
    lapakID
  </a>
  <div class="nav-right">
    <a href="/user/topup.html" class="saldo-chip">🪙 <span id="navCoins">...</span></a>
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">U</div>
        <span class="user-name" id="navUsername">...</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/user/dashboard.html" class="dropdown-item">🏠 Dashboard</a>
        <a href="/user/id.html" class="dropdown-item">🎮 Lihat ID</a>
        <a href="/user/transaksi.html" class="dropdown-item">📋 Transaksi</a>
        <a href="/user/topup.html" class="dropdown-item">🪙 Top Up</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>

<div class="main-content">
  <div class="page-header">
    <h1>🛒 Keranjang Belanja</h1>
    <p>Periksa dan bayar ID yang kamu pilih</p>
  </div>
  <div id="cartList"><div style="text-align:center;padding:40px;color:var(--muted)">Memuat...</div></div>
</div>

<div class="checkout-bar" id="checkoutBar" style="display:none">
  <div class="checkout-info">
    <div class="checkout-count" id="checkoutCount">0 item</div>
    <div class="checkout-total" id="checkoutTotal">Rp 0</div>
    <div class="saldo-info" id="saldoInfo"></div>
  </div>
  <button class="btn-checkout" id="checkoutBtn">Bayar Sekarang</button>
</div>

<div id="successModal" class="modal">
  <div class="modal-box">
    <div class="modal-title">🎉 Pembelian Berhasil!</div>
    <div class="modal-sub">Simpan data ID di bawah ini</div>
    <div id="successResults"></div>
    <button class="btn-done" onclick="document.getElementById('successModal').classList.remove('active');window.location.href='/user/transaksi.html'">Lihat Riwayat →</button>
  </div>
</div>

<footer>© 2026 lapakID</footer>
</div>

<script src="/js/api.js"></script>
<script>
Auth.requireLogin('/signin.html');
let userData = Auth.getUser() || {};
let cartData = [];

document.getElementById('navAvatar').textContent = (userData.fullName||userData.username||'U').charAt(0).toUpperCase();
document.getElementById('navUsername').textContent = userData.username||'';

async function loadAll(){
  try {
    const [profileRes, cartRes] = await Promise.all([UserAPI.profile(), UserAPI.getCart()]);
    if(profileRes && profileRes.success) userData = profileRes.user;
    document.getElementById('navCoins').textContent = 'C.'+(userData.coins||0).toLocaleString('id-ID');
    if(cartRes && cartRes.success){ cartData = cartRes.cart||[]; renderCart(); }
  } catch(e){ console.error(e); }
}

function renderCart(){
  const list = document.getElementById('cartList');
  const bar = document.getElementById('checkoutBar');
  if(!cartData.length){
    list.innerHTML = '<div class="empty-state">Keranjang kosong.<a href="/user/id.html">← Lihat ID</a></div>';
    bar.style.display = 'none'; return;
  }
  const total = cartData.reduce((s,i)=>s+(i.price||0),0);
  list.innerHTML = cartData.map(item=>{
    const tier = (item.tier||'low').toLowerCase();
    return `<div class="cart-item">
      <div class="cart-item-left">
        <div class="ci-id">${item.gameId||item.idItem}</div>
        <div class="ci-tier tb-${tier}">${tier.charAt(0).toUpperCase()+tier.slice(1)}</div>
        <div class="ci-price">Rp${Number(item.price||0).toLocaleString('id-ID')}</div>
      </div>
      <button class="btn-remove" onclick="removeItem('${item.idItem}')">Hapus</button>
    </div>`;
  }).join('');
  document.getElementById('checkoutCount').textContent = cartData.length+' item';
  document.getElementById('checkoutTotal').textContent = 'Rp'+total.toLocaleString('id-ID');
  const kurang = total - (userData.coins||0);
  const saldoEl = document.getElementById('saldoInfo');
  const btn = document.getElementById('checkoutBtn');
  if(kurang > 0){
    saldoEl.innerHTML = `<span class="saldo-warn">Saldo kurang Rp${kurang.toLocaleString('id-ID')}. <a href="/user/topup.html" style="color:var(--danger)">Top Up</a></span>`;
    btn.disabled = true;
  } else {
    saldoEl.textContent = 'Saldo: Rp'+(userData.coins||0).toLocaleString('id-ID');
    btn.disabled = false;
  }
  bar.style.display = 'flex';
}

async function removeItem(idItem){
  const res = await UserAPI.removeFromCart(idItem);
  if(res && res.success){
    cartData = cartData.filter(c=>c.idItem!==idItem);
    renderCart();
    showToast('Item dihapus','info');
  } else {
    showToast('Gagal menghapus item','error');
  }
}

document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await PaymentAPI.buyCart();
    if(res && res.success){
      userData.coins = res.newCoins;
      document.getElementById('navCoins').textContent = 'C.'+res.newCoins.toLocaleString('id-ID');
      Auth.setSession(Auth.getToken(), {...Auth.getUser(), coins: res.newCoins});
      cartData = [];
      showSuccessModal(res.purchases);
    } else {
      showToast('❌ '+(res?.message||'Pembayaran gagal'),'error');
      btn.disabled = false; btn.textContent = 'Bayar Sekarang';
    }
  } catch(e){
    showToast('❌ Terjadi kesalahan','error');
    btn.disabled = false; btn.textContent = 'Bayar Sekarang';
  }
});

function showSuccessModal(purchases){
  const res = document.getElementById('successResults');
  res.innerHTML = purchases.map(p=>`
    <div class="result-card">
      <div class="rc-id">${p.gameId}</div>
      <div class="rc-row"><span class="rc-label">UID</span><span class="rc-val">${p.uid}</span></div>
      <div class="rc-row"><span class="rc-label">Password</span><span class="rc-val">${p.password}</span></div>
      <div class="rc-row"><span class="rc-label">Tier</span><span class="rc-val">${p.tier}</span></div>
      <div class="rc-row"><span class="rc-label">Harga</span><span class="rc-val">Rp${Number(p.price).toLocaleString('id-ID')}</span></div>
      <button class="btn-copy" onclick="copyAll('${p.gameId}','${p.uid}','${p.password}')">Salin Semua</button>
    </div>`).join('');
  document.getElementById('successModal').classList.add('active');
  renderCart();
}

function copyAll(id, uid, pass){
  navigator.clipboard.writeText(`Game ID: ${id}\nUID: ${uid}\nPassword: ${pass}`);
  showToast('Disalin!','success');
}

const drop = document.getElementById('userDropdown');
drop.addEventListener('click',e=>{e.stopPropagation();drop.classList.toggle('active');});
document.addEventListener('click',()=>drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click',()=>{Auth.clear();window.location.href='/signin.html';});
function initDarkMode(){const btn=document.getElementById('darkModeToggle');let dark=localStorage.getItem('darkMode')==='true';const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};a(dark);btn.onclick=()=>{dark=!dark;a(dark);};}
initDarkMode();
loadAll();
</script>
</body>
</html>
