<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Kelola User | lapakID Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--purple:#465fff;--success:#12b76a;--danger:#f04438;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:1100px;margin:0 auto;padding:80px 16px 60px;width:100%;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:26px;height:26px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.admin-badge{background:rgba(240,68,56,.12);color:var(--danger);border:1px solid rgba(240,68,56,.25);border-radius:40px;padding:2px 8px;font-size:.6rem;font-weight:700}
.nav-right{display:flex;align-items:center;gap:8px}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 6px;border-radius:99px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--danger);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.65rem}
.user-name{font-size:.65rem;font-weight:600;display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.55rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:190px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--text);font-size:.72rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}
.page-header{margin-bottom:18px}
.page-header h1{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:.82rem;color:var(--text);font-family:var(--font);outline:none;margin-bottom:14px}
.search-input:focus{border-color:var(--purple)}
.table-wrapper{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;overflow-x:auto}
.user-table{width:100%;border-collapse:collapse}
.user-table th{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;text-align:left;border-bottom:2px solid var(--border)}
.user-table td{padding:9px 12px;font-size:.78rem;border-bottom:1px solid var(--border);vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}
.user-table tr:hover td{background:var(--bg2)}
.u-avatar{width:28px;height:28px;border-radius:50%;background:var(--purple);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.7rem;margin-right:6px;vertical-align:middle}
.u-name{font-weight:600}
.u-sub{font-size:.62rem;color:var(--muted)}
.coins-val{font-family:var(--mono);font-weight:700;color:var(--purple)}
.btn-edit-coins{background:rgba(70,95,255,.1);color:var(--purple);border:1px solid rgba(70,95,255,.25);border-radius:7px;padding:3px 9px;font-size:.65rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-edit-coins:hover{background:var(--purple);color:#fff}
.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:.85rem}
.load-more{display:block;width:100%;padding:11px;background:var(--bg2);border:1px solid var(--border);border-radius:40px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);margin-top:16px}
.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <div class="nav-left">
    <a href="/admin/dashboard.html" class="nav-logo">
      <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
      lapakID
    </a>
    <span class="admin-badge">ADMIN</span>
  </div>
  <div class="nav-right">
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">A</div>
        <span class="user-name" id="navUsername">Admin</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/admin/dashboard.html" class="dropdown-item">📊 Dashboard</a>
        <a href="/admin/addid.html" class="dropdown-item">➕ Tambah ID</a>
        <a href="/admin/ids.html" class="dropdown-item">🎮 Kelola ID</a>
        <a href="/admin/topup.html" class="dropdown-item">🪙 Kelola Topup</a>
        <a href="/admin/transaksi.html" class="dropdown-item">📋 Transaksi</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>
<div class="main-content">
  <div class="page-header"><h1>👥 Kelola User</h1></div>
  <input type="search" class="search-input" id="searchInput" placeholder="Cari username, nama, email..."/>
  <div class="table-wrapper">
    <table class="user-table">
      <thead><tr><th>User</th><th>Email/WA</th><th>Coins</th><th>Transaksi</th><th>Bergabung</th><th>Aksi</th></tr></thead>
      <tbody id="userTableBody"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Memuat...</td></tr></tbody>
    </table>
  </div>
  <button id="loadMoreBtn" class="load-more" style="display:none">Muat lebih banyak</button>
</div>
<footer>© 2026 lapakID Admin</footer>
</div>
<script src="/js/api.js"></script>
<script>
Auth.requireAdmin('/signin.html');
const admin = Auth.getUser() || {};
document.getElementById('navAvatar').textContent = (admin.fullName||admin.username||'A').charAt(0).toUpperCase();
document.getElementById('navUsername').textContent = admin.username || 'Admin';

let page=1, allData=[], total=0, searchQ='';

async function loadData(reset=true){
  if(reset){page=1;allData=[];}
  const params={page,limit:25};
  if(searchQ) params.search=searchQ;
  const res = await AdminAPI.users(params);
  if(res && res.success){
    if(reset) allData=res.users; else allData=[...allData,...res.users];
    total=res.total||0; renderTable();
    document.getElementById('loadMoreBtn').style.display = allData.length<total?'block':'none';
  }
}

function renderTable(){
  const tb = document.getElementById('userTableBody');
  if(!allData.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Tidak ada user.</td></tr>'; return; }
  tb.innerHTML = allData.map(u=>`<tr>
    <td>
      <span class="u-avatar">${(u.fullName||u.username||'U').charAt(0).toUpperCase()}</span>
      <span class="u-name">${u.username}</span><br/>
      <span class="u-sub">${u.fullName||''}</span>
    </td>
    <td style="font-size:.72rem">${u.emailPhone||'—'}</td>
    <td><span class="coins-val">C.${Number(u.coins||0).toLocaleString('id-ID')}</span></td>
    <td style="font-size:.7rem">✅${(u.totalTransaksi?.success||0)}</td>
    <td style="font-size:.65rem;color:var(--muted)">${new Date(u.createdAt).toLocaleDateString('id-ID')}</td>
    <td><button class="btn-edit-coins" onclick="editCoins('${u._id}','${u.username}',${u.coins||0})">✏️ Coins</button></td>
  </tr>`).join('');
}

async function editCoins(userId, username, current){
  const val = prompt(`Edit coins @${username}\nSaldo saat ini: ${current}\nMasukkan saldo baru:`);
  if(val === null || isNaN(val)) return;
  const res = await AdminAPI.editCoins(userId, parseInt(val));
  if(res&&res.success){ showToast('✅ Coins @'+username+' diperbarui','success'); loadData(); }
  else showToast('❌ '+(res?.message||'Gagal'),'error');
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  clearTimeout(searchTimer); searchTimer=setTimeout(()=>loadData(),400);
});
document.getElementById('loadMoreBtn').addEventListener('click',()=>{page++;loadData(false);});

const drop=document.getElementById('userDropdown');
drop.addEventListener('click',e=>{e.stopPropagation();drop.classList.toggle('active');});
document.addEventListener('click',()=>drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click',()=>{Auth.clear();window.location.href='/signin.html';});
function initDarkMode(){const btn=document.getElementById('darkModeToggle');let dark=localStorage.getItem('darkMode')==='true';const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};a(dark);btn.onclick=()=>{dark=!dark;a(dark);};}
initDarkMode();loadData();
</script>
</body>
</html>
