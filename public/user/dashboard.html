<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Dashboard | lapakID</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--muted2:#475467;--purple:#465fff;--success:#12b76a;--warning:#f79009;--danger:#f04438;--legend:#eab308;--high:#f97316;--medium:#3b82f6;--low:#6b7280;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;--muted2:#aaa;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:1280px;margin:0 auto;padding:88px 20px 60px;width:100%;}
@media(min-width:768px){.main-content{padding:100px 32px 60px}}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:28px;height:28px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-right{display:flex;align-items:center;gap:8px}
.saldo-chip{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--purple),#7592ff);border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700;color:#fff;cursor:pointer;text-decoration:none}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);padding:4px 12px 4px 8px;border-radius:99px;cursor:pointer}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.75rem}
.user-name{font-size:.7rem;font-weight:600;color:var(--text);display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.6rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.1);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text);font-size:.75rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}
.dropdown-item.logout:hover{background:rgba(240,68,56,.08)}

.welcome-card{background:linear-gradient(135deg,#465fff 0%,#7592ff 60%,#5b73ff 100%);border-radius:24px;padding:24px;margin-bottom:24px;position:relative;overflow:hidden}
.welcome-card::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.welcome-card h1{font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:4px;position:relative}
.welcome-card p{color:rgba(255,255,255,.85);font-size:.75rem;position:relative}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
@media(min-width:768px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat-chip{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.2)}
.stat-chip .val{font-size:1.1rem;font-weight:800;color:#fff}
.stat-chip .lbl{font-size:.6rem;color:rgba(255,255,255,.75);margin-top:2px}

.quick-links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:640px){.quick-links{grid-template-columns:repeat(4,1fr)}}
.ql-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 14px;text-align:center;text-decoration:none;color:var(--text);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.ql-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 6px 20px rgba(70,95,255,.12)}
.ql-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.ql-label{font-size:.75rem;font-weight:600}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:700}
.card-link{font-size:.72rem;color:var(--purple);text-decoration:none;font-weight:600}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-id{font-size:.78rem;font-weight:600;font-family:var(--mono)}
.tx-time{font-size:.65rem;color:var(--muted);margin-top:2px}
.tx-price{font-size:.8rem;font-weight:700;color:var(--success)}
.tier-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700}
.tier-low{background:rgba(107,114,128,.15);color:var(--low)}
.tier-medium{background:rgba(59,130,246,.15);color:var(--medium)}
.tier-high{background:rgba(249,115,22,.15);color:var(--high)}
.tier-legend{background:rgba(234,179,8,.15);color:var(--legend)}
.empty-state{text-align:center;padding:28px;color:var(--muted);font-size:.8rem}

.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--bg2) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;height:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <div class="nav-left">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
      lapakID
    </a>
  </div>
  <div class="nav-right">
    <a href="/user/topup.html" class="saldo-chip">🪙 <span id="navCoins">...</span></a>
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">U</div>
        <span class="user-name" id="navUsername">...</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/user/dashboard.html" class="dropdown-item">🏠 Dashboard</a>
        <a href="/user/id.html" class="dropdown-item">🎮 Lihat ID</a>
        <a href="/user/cart.html" class="dropdown-item">🛒 Keranjang</a>
        <a href="/user/transaksi.html" class="dropdown-item">📋 Transaksi</a>
        <a href="/user/topup.html" class="dropdown-item">🪙 Top Up</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>

<div class="main-content">
  <!-- Welcome Card -->
  <div class="welcome-card">
    <h1 id="welcomeName">Selamat datang 👋</h1>
    <p id="welcomeSub">Siap berburu ID premium hari ini?</p>
    <div class="stats-row">
      <div class="stat-chip"><div class="val" id="statCoins">...</div><div class="lbl">Coins</div></div>
      <div class="stat-chip"><div class="val" id="statSuccess">0</div><div class="lbl">Berhasil</div></div>
      <div class="stat-chip"><div class="val" id="statCart">0</div><div class="lbl">Keranjang</div></div>
      <div class="stat-chip"><div class="val" id="statTotal">0</div><div class="lbl">Total Beli</div></div>
    </div>
  </div>

  <!-- Quick Links -->
  <div class="quick-links">
    <a href="/user/id.html" class="ql-card">
      <div class="ql-icon" style="background:rgba(70,95,255,.12)">🎮</div>
      <span class="ql-label">Lihat ID</span>
    </a>
    <a href="/user/cart.html" class="ql-card">
      <div class="ql-icon" style="background:rgba(18,183,106,.12)">🛒</div>
      <span class="ql-label">Keranjang</span>
    </a>
    <a href="/user/transaksi.html" class="ql-card">
      <div class="ql-icon" style="background:rgba(247,144,9,.12)">📋</div>
      <span class="ql-label">Transaksi</span>
    </a>
    <a href="/user/topup.html" class="ql-card">
      <div class="ql-icon" style="background:rgba(234,179,8,.12)">🪙</div>
      <span class="ql-label">Top Up</span>
    </a>
  </div>

  <!-- Recent Purchases -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">📦 Pembelian Terakhir</span>
      <a href="/user/transaksi.html" class="card-link">Lihat semua →</a>
    </div>
    <div id="recentPurchases"><div class="skeleton" style="margin:8px 0"></div><div class="skeleton" style="margin:8px 0;width:70%"></div></div>
  </div>
</div>

<footer>© 2026 lapakID</footer>
</div>

<script src="/js/api.js"></script>
<script>
Auth.requireLogin('/signin.html');

let userData = Auth.getUser() || {};

async function loadDashboard() {
  try {
    // Load profile + cart sekaligus
    const [profileRes, cartRes, purchasesRes] = await Promise.all([
      UserAPI.profile(),
      UserAPI.getCart(),
      TransaksiAPI.purchases({ limit: 5 })
    ]);

    if (profileRes && profileRes.success) {
      userData = profileRes.user;
      // Update session dengan data terbaru
      Auth.setSession(Auth.getToken(), { ...Auth.getUser(), coins: userData.coins });
    }

    const coins = userData.coins || 0;
    const tx = userData.totalTransaksi || {};

    document.getElementById('navCoins').textContent = 'C.' + coins.toLocaleString('id-ID');
    document.getElementById('navAvatar').textContent = (userData.fullName || userData.username || 'U').charAt(0).toUpperCase();
    document.getElementById('navUsername').textContent = userData.username || '';
    document.getElementById('welcomeName').textContent = 'Selamat datang, ' + (userData.fullName || userData.username) + ' 👋';
    document.getElementById('statCoins').textContent = 'C.' + coins.toLocaleString('id-ID');
    document.getElementById('statSuccess').textContent = tx.success || 0;
    document.getElementById('statTotal').textContent = (tx.success || 0) + (tx.pending || 0) + (tx.gagal || 0);

    if (cartRes && cartRes.success) {
      document.getElementById('statCart').textContent = (cartRes.cart || []).length;
    }

    // Recent purchases
    const container = document.getElementById('recentPurchases');
    if (purchasesRes && purchasesRes.success && purchasesRes.purchases.length > 0) {
      container.innerHTML = purchasesRes.purchases.map(p => `
        <div class="tx-item">
          <div>
            <div class="tx-id">${p.gameId}</div>
            <div class="tx-time">${new Date(p.soldAt).toLocaleString('id-ID')}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="tier-badge tier-${(p.tier||'low').toLowerCase()}">${p.tier}</span>
            <span class="tx-price">-Rp${Number(p.price).toLocaleString('id-ID')}</span>
          </div>
        </div>`).join('');
    } else {
      container.innerHTML = '<div class="empty-state">Belum ada pembelian.</div>';
    }
  } catch(err) {
    console.error(err);
  }
}

// Dropdown
const drop = document.getElementById('userDropdown');
drop.addEventListener('click', e => { e.stopPropagation(); drop.classList.toggle('active'); });
document.addEventListener('click', () => drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click', () => {
  Auth.clear();
  window.location.href = '/signin.html';
});

// Dark mode
function initDarkMode(){
  const btn=document.getElementById('darkModeToggle');
  let dark=localStorage.getItem('darkMode')==='true';
  const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};
  a(dark);btn.onclick=()=>{dark=!dark;a(dark);};
}

initDarkMode();
loadDashboard();
</script>
</body>
</html>
