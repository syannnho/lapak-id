<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Top Up Coins | lapakID</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--purple:#465fff;--success:#12b76a;--warning:#f79009;--danger:#f04438;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:720px;margin:0 auto;padding:80px 16px 60px;width:100%;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:26px;height:26px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-right{display:flex;align-items:center;gap:8px}
.saldo-chip{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--purple),#7592ff);border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:700;color:#fff;}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 6px;border-radius:99px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.65rem}
.user-name{font-size:.65rem;font-weight:600;display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.55rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:180px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.1);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--text);font-size:.72rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}

.hero-saldo{background:linear-gradient(135deg,#465fff,#7592ff);border-radius:24px;padding:24px;margin-bottom:24px;text-align:center}
.hero-saldo .lbl{font-size:.75rem;color:rgba(255,255,255,.8);margin-bottom:6px}
.hero-saldo .amount{font-size:2.2rem;font-weight:900;color:#fff;font-family:var(--mono)}
.hero-saldo .sub{font-size:.72rem;color:rgba(255,255,255,.7);margin-top:4px}

.section-title{font-size:1rem;font-weight:700;margin-bottom:14px}
.pkg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
@media(min-width:480px){.pkg-grid{grid-template-columns:repeat(3,1fr)}}
.pkg-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.pkg-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.pkg-card.selected{border-color:var(--purple);background:rgba(70,95,255,.05)}
.pkg-card.popular::before{content:'Popular';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--purple);color:#fff;font-size:.55rem;font-weight:700;padding:2px 10px;border-radius:40px;letter-spacing:.5px}
.pkg-coins{font-size:1.1rem;font-weight:800;color:var(--text)}
.pkg-bonus{font-size:.62rem;color:var(--success);font-weight:600;margin-top:2px}
.pkg-price{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:6px}

.info-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.78rem}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--muted)}
.info-val{font-weight:600}

.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25d366;color:#fff;border:none;border-radius:40px;padding:14px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;transition:all .2s;text-decoration:none}
.wa-btn:hover{background:#1da851;transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,211,102,.3)}
.wa-btn img{width:20px;height:20px}
.select-first{text-align:center;padding:16px;color:var(--muted);font-size:.8rem;border:1px dashed var(--border);border-radius:14px}

.history-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hi-pkg{font-size:.8rem;font-weight:600}
.hi-time{font-size:.62rem;color:var(--muted);margin-top:2px}
.hi-status{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:6px}
.status-pending{background:rgba(247,144,9,.15);color:var(--warning)}
.status-approved{background:rgba(18,183,106,.15);color:var(--success)}
.status-rejected{background:rgba(240,68,56,.15);color:var(--danger)}
.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
    lapakID
  </a>
  <div class="nav-right">
    <div class="saldo-chip">🪙 <span id="navCoins">...</span></div>
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">U</div>
        <span class="user-name" id="navUsername">...</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/user/dashboard.html" class="dropdown-item">🏠 Dashboard</a>
        <a href="/user/id.html" class="dropdown-item">🎮 Lihat ID</a>
        <a href="/user/cart.html" class="dropdown-item">🛒 Keranjang</a>
        <a href="/user/transaksi.html" class="dropdown-item">📋 Transaksi</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>

<div class="main-content">
  <div class="hero-saldo">
    <div class="lbl">Saldo Coins Kamu</div>
    <div class="amount" id="heroCoins">...</div>
    <div class="sub">Top up untuk membeli ID premium</div>
  </div>

  <div class="section-title">💰 Pilih Paket Top Up</div>
  <div class="pkg-grid" id="pkgGrid"></div>

  <div id="checkoutSection">
    <div class="select-first">Pilih paket top up di atas</div>
  </div>

  <div style="margin-top:24px">
    <div class="section-title">📜 Riwayat Top Up</div>
    <div id="topupHistory"><div style="color:var(--muted);font-size:.8rem;text-align:center;padding:20px">Memuat...</div></div>
  </div>
</div>
<footer>© 2026 lapakID</footer>
</div>

<script src="/js/api.js"></script>
<script>
Auth.requireLogin('/signin.html');
let userData = Auth.getUser() || {};
let selectedPkg = null;
const WA_NUMBER = '628123456789';

const packages = [
  { id:'p1', label:'Starter', coins:10000, bonus:0, price:10000 },
  { id:'p2', label:'Basic', coins:25000, bonus:2000, price:24000 },
  { id:'p3', label:'Standard', coins:50000, bonus:6000, price:47000, popular:true },
  { id:'p4', label:'Pro', coins:100000, bonus:15000, price:92000 },
  { id:'p5', label:'Premium', coins:250000, bonus:50000, price:225000 },
  { id:'p6', label:'Elite', coins:500000, bonus:120000, price:440000 },
];

async function init(){
  const profileRes = await UserAPI.profile();
  if(profileRes && profileRes.success) userData = profileRes.user;
  const coins = userData.coins || 0;
  document.getElementById('navCoins').textContent = 'C.'+coins.toLocaleString('id-ID');
  document.getElementById('heroCoins').textContent = 'C.'+coins.toLocaleString('id-ID');
  document.getElementById('navAvatar').textContent = (userData.fullName||userData.username||'U').charAt(0).toUpperCase();
  document.getElementById('navUsername').textContent = userData.username||'';
  renderPackages();
  loadHistory();
}

function renderPackages(){
  document.getElementById('pkgGrid').innerHTML = packages.map(p=>`
    <div class="pkg-card${p.popular?' popular':''}${selectedPkg===p.id?' selected':''}" onclick="selectPkg('${p.id}')">
      <div class="pkg-coins">${(p.coins+p.bonus).toLocaleString()}</div>
      ${p.bonus>0?`<div class="pkg-bonus">+${p.bonus.toLocaleString()} bonus</div>`:'<div style="height:16px"></div>'}
      <div class="pkg-price">Rp${p.price.toLocaleString('id-ID')}</div>
    </div>`).join('');
}

function selectPkg(id){
  selectedPkg = id;
  renderPackages();
  updateCheckout();
}

function updateCheckout(){
  const section = document.getElementById('checkoutSection');
  if(!selectedPkg){ section.innerHTML='<div class="select-first">Pilih paket top up di atas</div>'; return; }
  const pkg = packages.find(p=>p.id===selectedPkg);
  const total = pkg.coins + pkg.bonus;
  const waMsg = encodeURIComponent(`Halo Admin lapakID, saya ingin Top Up Coins:\n\nPaket: ${pkg.label}\nCoins: ${total.toLocaleString()} Coins${pkg.bonus>0?' (termasuk bonus '+pkg.bonus.toLocaleString()+' coins)':''}\nHarga: Rp ${pkg.price.toLocaleString()}\nUsername: ${userData.username}\n\nMohon diproses. Terima kasih!`);
  section.innerHTML = `
    <div class="info-card">
      <div class="info-row"><span class="info-label">Paket</span><span class="info-val">${pkg.label}</span></div>
      <div class="info-row"><span class="info-label">Coins</span><span class="info-val">${total.toLocaleString()} Coins</span></div>
      ${pkg.bonus>0?`<div class="info-row"><span class="info-label">Bonus</span><span class="info-val" style="color:var(--success)">+${pkg.bonus.toLocaleString()} Coins</span></div>`:''}
      <div class="info-row"><span class="info-label">Harga</span><span class="info-val">Rp${pkg.price.toLocaleString('id-ID')}</span></div>
    </div>
    <a href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank" class="wa-btn" onclick="sendTopupRequest()">
      <img src="https://img.icons8.com/?size=100&id=A1JUR9NobMSO&format=png&color=ffffff" alt="WA"/>
      Top Up via WhatsApp
    </a>`;
}

async function sendTopupRequest(){
  if(!selectedPkg) return;
  const pkg = packages.find(p=>p.id===selectedPkg);
  try {
    await TopupAPI.request({ packageId: pkg.id, coins: pkg.coins+pkg.bonus, amount: pkg.price });
  } catch(e){}
}

async function loadHistory(){
  const res = await TopupAPI.history();
  const el = document.getElementById('topupHistory');
  if(!res || !res.success || !res.history.length){ el.innerHTML='<div style="color:var(--muted);font-size:.8rem;text-align:center;padding:16px">Belum ada riwayat top up.</div>'; return; }
  el.innerHTML = res.history.map(h=>`
    <div class="history-card">
      <div>
        <div class="hi-pkg">${h.coins.toLocaleString()} Coins — Rp${Number(h.amount).toLocaleString('id-ID')}</div>
        <div class="hi-time">${new Date(h.createdAt).toLocaleString('id-ID')}</div>
      </div>
      <span class="hi-status status-${h.status}">${h.status}</span>
    </div>`).join('');
}

const drop = document.getElementById('userDropdown');
drop.addEventListener('click',e=>{e.stopPropagation();drop.classList.toggle('active');});
document.addEventListener('click',()=>drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click',()=>{Auth.clear();window.location.href='/signin.html';});
function initDarkMode(){const btn=document.getElementById('darkModeToggle');let dark=localStorage.getItem('darkMode')==='true';const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};a(dark);btn.onclick=()=>{dark=!dark;a(dark);};}
initDarkMode();init();
</script>
</body>
</html>
