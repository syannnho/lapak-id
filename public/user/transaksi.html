<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Transaksi | lapakID</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--purple:#465fff;--success:#12b76a;--warning:#f79009;--danger:#f04438;--legend:#eab308;--high:#f97316;--medium:#3b82f6;--low:#6b7280;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:800px;margin:0 auto;padding:80px 16px 60px;width:100%;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:26px;height:26px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-right{display:flex;align-items:center;gap:8px}
.saldo-chip{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--purple),#7592ff);border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:700;color:#fff;text-decoration:none}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 6px;border-radius:99px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.65rem}
.user-name{font-size:.65rem;font-weight:600;display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.55rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:180px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.1);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--text);font-size:.72rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}
.page-header{margin-bottom:20px}
.page-header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.3px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:1.1rem;font-weight:800}
.stat-lbl{font-size:.6rem;color:var(--muted);margin-top:2px}

.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--bg2);border:1px solid var(--border);border-radius:40px;padding:6px 14px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}

.purchase-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.pc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.pc-id{font-size:.9rem;font-weight:700;font-family:var(--mono)}
.pc-date{font-size:.65rem;color:var(--muted)}
.pc-tier{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700}
.tb-low{background:rgba(107,114,128,.15);color:var(--low)}
.tb-medium{background:rgba(59,130,246,.15);color:var(--medium)}
.tb-high{background:rgba(249,115,22,.15);color:var(--high)}
.tb-legend{background:rgba(234,179,8,.15);color:var(--legend)}
.pc-credentials{background:var(--bg2);border-radius:10px;padding:10px;font-size:.72rem;font-family:var(--mono);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .2s}
.pc-credentials:hover{border-color:var(--purple)}
.pc-cred-row{display:flex;justify-content:space-between;gap:8px}
.pc-cred-label{color:var(--muted);flex-shrink:0}
.pc-cred-val{font-weight:600;word-break:break-all;text-align:right}
.pc-price{font-size:.78rem;font-weight:700;color:var(--danger);margin-top:8px}
.btn-copy-small{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.65rem;cursor:pointer;color:var(--muted);margin-top:6px;transition:all .2s}
.btn-copy-small:hover{border-color:var(--purple);color:var(--purple)}
.empty-state{text-align:center;padding:48px;color:var(--muted);font-size:.85rem}
.load-more{display:block;width:100%;padding:11px;background:var(--bg2);border:1px solid var(--border);border-radius:40px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);margin-top:16px}
.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
    lapakID
  </a>
  <div class="nav-right">
    <a href="/user/topup.html" class="saldo-chip">🪙 <span id="navCoins">...</span></a>
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">U</div>
        <span class="user-name" id="navUsername">...</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/user/dashboard.html" class="dropdown-item">🏠 Dashboard</a>
        <a href="/user/id.html" class="dropdown-item">🎮 Lihat ID</a>
        <a href="/user/cart.html" class="dropdown-item">🛒 Keranjang</a>
        <a href="/user/topup.html" class="dropdown-item">🪙 Top Up</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>

<div class="main-content">
  <div class="page-header">
    <h1>📋 Riwayat Transaksi</h1>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--success)" id="sSuccess">0</div><div class="stat-lbl">Berhasil</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--danger)" id="sSpent">Rp0</div><div class="stat-lbl">Dihabiskan</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="purchases">ID Dibeli</button>
    <button class="tab" data-tab="history">Riwayat</button>
  </div>
  <div id="listContainer"><div style="text-align:center;padding:40px;color:var(--muted)">Memuat...</div></div>
  <button id="loadMoreBtn" class="load-more" style="display:none">Muat lebih banyak</button>
</div>
<footer>© 2026 lapakID</footer>
</div>

<script src="/js/api.js"></script>
<script>
Auth.requireLogin('/signin.html');
const user = Auth.getUser() || {};
document.getElementById('navAvatar').textContent = (user.fullName||user.username||'U').charAt(0).toUpperCase();
document.getElementById('navUsername').textContent = user.username||'';
document.getElementById('navCoins').textContent = 'C.'+(user.coins||0).toLocaleString('id-ID');

let activeTab = 'purchases', page = 1, allData = [], total = 0;

async function loadData(reset=true){
  if(reset){ page=1; allData=[]; }
  const params = { page, limit: 15 };
  let res;
  if(activeTab==='purchases') res = await TransaksiAPI.purchases(params);
  else res = await TransaksiAPI.list(params);
  if(res && res.success){
    const items = activeTab==='purchases' ? res.purchases : res.transaksi;
    if(reset) allData=items; else allData=[...allData,...items];
    total = res.total || 0;
    renderList();
    document.getElementById('loadMoreBtn').style.display = allData.length < total ? 'block' : 'none';
    updateStats();
  }
}

function updateStats(){
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sSuccess').textContent = (user.totalTransaksi?.success)||0;
  const spent = allData.reduce((s,i)=>s+(i.price||0),0);
  document.getElementById('sSpent').textContent = 'Rp'+spent.toLocaleString('id-ID');
}

function renderList(){
  const c = document.getElementById('listContainer');
  if(!allData.length){ c.innerHTML='<div class="empty-state">Belum ada data.</div>'; return; }
  if(activeTab==='purchases'){
    c.innerHTML = allData.map(p=>{
      const tier=(p.tier||'low').toLowerCase();
      return `<div class="purchase-card">
        <div class="pc-header">
          <div>
            <div class="pc-id">${p.gameId}</div>
            <div class="pc-date">${new Date(p.soldAt).toLocaleString('id-ID')}</div>
          </div>
          <span class="pc-tier tb-${tier}">${tier.charAt(0).toUpperCase()+tier.slice(1)}</span>
        </div>
        <div class="pc-credentials" onclick="copyAll('${p.gameId}','${p.uid}','${p.password}')">
          <div class="pc-cred-row"><span class="pc-cred-label">UID</span><span class="pc-cred-val">${p.uid}</span></div>
          <div class="pc-cred-row"><span class="pc-cred-label">Password</span><span class="pc-cred-val">${p.password}</span></div>
          <div style="font-size:.6rem;color:var(--muted);text-align:center;margin-top:4px">Ketuk untuk menyalin</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="pc-price">-Rp${Number(p.price).toLocaleString('id-ID')}</span>
          <button class="btn-copy-small" onclick="copyAll('${p.gameId}','${p.uid}','${p.password}')">📋 Salin</button>
        </div>
      </div>`;
    }).join('');
  } else {
    c.innerHTML = allData.map(tx=>{
      const tier=(tx.tier||'low').toLowerCase();
      return `<div class="purchase-card">
        <div class="pc-header">
          <div>
            <div class="pc-id">${tx.gameId||tx.txId}</div>
            <div class="pc-date">${new Date(tx.createdAt).toLocaleString('id-ID')}</div>
          </div>
          <span class="pc-tier tb-${tier}">${tier.charAt(0).toUpperCase()+tier.slice(1)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="pc-price">-Rp${Number(tx.price).toLocaleString('id-ID')}</span>
          <span style="font-size:.7rem;color:var(--success);font-weight:600">✅ ${tx.status}</span>
        </div>
      </div>`;
    }).join('');
  }
}

function copyAll(id,uid,pass){
  navigator.clipboard.writeText(`Game ID: ${id}\nUID: ${uid}\nPassword: ${pass}`);
  showToast('Disalin ke clipboard!','success');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeTab=t.dataset.tab; loadData();
}));
document.getElementById('loadMoreBtn').addEventListener('click',()=>{page++;loadData(false);});

const drop = document.getElementById('userDropdown');
drop.addEventListener('click',e=>{e.stopPropagation();drop.classList.toggle('active');});
document.addEventListener('click',()=>drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click',()=>{Auth.clear();window.location.href='/signin.html';});
function initDarkMode(){const btn=document.getElementById('darkModeToggle');let dark=localStorage.getItem('darkMode')==='true';const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};a(dark);btn.onclick=()=>{dark=!dark;a(dark);};}
initDarkMode();loadData();
</script>
</body>
</html>
