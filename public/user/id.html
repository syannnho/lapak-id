<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Daftar ID | lapakID</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9fafb;--bg2:#f2f4f7;--card:#fff;--border:#e4e7ec;--text:#101828;--muted:#667085;--purple:#465fff;--success:#12b76a;--warning:#f79009;--danger:#f04438;--legend:#eab308;--high:#f97316;--medium:#3b82f6;--low:#6b7280;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;}
body.dark-mode{--bg:#000;--bg2:#0a0a0a;--card:#111;--border:#222;--text:#fff;--muted:#888;}
body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s;min-height:100vh;display:flex;flex-direction:column;}
.app-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-content{flex:1;max-width:1280px;margin:0 auto;padding:80px 16px 60px;width:100%;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
@media(min-width:768px){nav{padding:0 32px;height:68px}}
body.dark-mode nav{background:rgba(0,0,0,.96)}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--text);text-decoration:none}
.nav-logo-icon{width:26px;height:26px;border-radius:8px;overflow:hidden}
.nav-logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-right{display:flex;align-items:center;gap:8px}
.saldo-chip{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--purple),#7592ff);border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:700;color:#fff;cursor:pointer;text-decoration:none}
.cart-chip{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:.7rem;font-weight:600;color:var(--text);text-decoration:none}
.cart-badge{background:var(--purple);color:#fff;border-radius:40px;padding:1px 6px;font-size:.6rem;font-weight:700}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:3px 10px 3px 6px;border-radius:99px;cursor:pointer}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.65rem}
.user-name{font-size:.65rem;font-weight:600;color:var(--text);display:none}
@media(min-width:480px){.user-name{display:inline-block}}
.dropdown-arrow{font-size:.55rem;color:var(--muted);transition:transform .2s}
.dropdown.active .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:16px;min-width:180px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.1);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:300}
.dropdown.active .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--text);font-size:.72rem;font-weight:500;border-bottom:1px solid var(--border);cursor:pointer;text-decoration:none}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--bg2);color:var(--purple)}
.dropdown-item.logout{color:var(--danger)}

.page-header{margin-bottom:20px}
.page-header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.3px}
.page-header p{color:var(--muted);font-size:.78rem;margin-top:4px}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.fb{background:var(--bg2);border:1px solid var(--border);border-radius:40px;padding:6px 14px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.fb.act{background:var(--purple);color:#fff;border-color:var(--purple)}

.search-bar{display:flex;gap:10px;margin-bottom:20px}
.search-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:.82rem;color:var(--text);font-family:var(--font);outline:none;transition:border .15s}
.search-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(70,95,255,.1)}

.id-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media(min-width:640px){.id-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}}
.id-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.id-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 6px 20px rgba(70,95,255,.1)}
.id-card.sold{opacity:.55;pointer-events:none}
.id-card .game-id{font-size:.85rem;font-weight:700;font-family:var(--mono);color:var(--text);word-break:break-all}
.id-card .tier-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.58rem;font-weight:700;margin-top:6px}
.id-card .price{font-size:.7rem;font-weight:600;color:var(--muted);margin-top:4px}
.tb-low{background:rgba(107,114,128,.15);color:var(--low)}
.tb-medium{background:rgba(59,130,246,.15);color:var(--medium)}
.tb-high{background:rgba(249,115,22,.15);color:var(--high)}
.tb-legend{background:rgba(234,179,8,.15);color:var(--legend)}
.sold-ribbon{position:absolute;top:6px;right:-14px;background:var(--danger);color:#fff;font-size:.5rem;font-weight:700;padding:3px 20px;transform:rotate(30deg);letter-spacing:.5px}

.load-more{display:block;width:100%;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:40px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text);margin-top:20px;transition:all .2s}
.load-more:hover{border-color:var(--purple);color:var(--purple)}
.empty-state{text-align:center;padding:48px;color:var(--muted);font-size:.85rem}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:.85rem}
.darkmode-btn{background:var(--bg2);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem}
footer{border-top:1px solid var(--border);padding:16px;text-align:center;background:var(--card);color:var(--muted);font-size:.65rem;}
</style>
</head>
<body>
<div class="app-wrapper">
<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon"><img src="https://files.catbox.moe/34dics.png" alt="lapakID"/></div>
    lapakID
  </a>
  <div class="nav-right">
    <a href="/user/topup.html" class="saldo-chip">🪙 <span id="navCoins">...</span></a>
    <a href="/user/cart.html" class="cart-chip">🛒 <span class="cart-badge" id="cartBadge">0</span></a>
    <div class="dropdown" id="userDropdown">
      <div class="dropdown-trigger">
        <div class="user-avatar" id="navAvatar">U</div>
        <span class="user-name" id="navUsername">...</span>
        <span class="dropdown-arrow">▼</span>
      </div>
      <div class="dropdown-menu">
        <a href="/user/dashboard.html" class="dropdown-item">🏠 Dashboard</a>
        <a href="/user/cart.html" class="dropdown-item">🛒 Keranjang</a>
        <a href="/user/transaksi.html" class="dropdown-item">📋 Transaksi</a>
        <a href="/user/topup.html" class="dropdown-item">🪙 Top Up</a>
        <div class="dropdown-item logout" id="logoutBtn">🚪 Logout</div>
      </div>
    </div>
    <button class="darkmode-btn" id="darkModeToggle">🌙</button>
  </div>
</nav>

<div class="main-content">
  <div class="page-header">
    <h1>🎮 Daftar ID</h1>
    <p>Pilih ID game premium yang tersedia</p>
  </div>

  <div class="search-bar">
    <input type="search" class="search-input" id="searchInput" placeholder="Cari game ID..."/>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div id="idGrid" class="id-grid"><div class="loading">Memuat ID...</div></div>
  <button id="loadMoreBtn" class="load-more" style="display:none">Muat lebih banyak</button>
</div>
<footer>© 2026 lapakID</footer>
</div>

<script src="/js/api.js"></script>
<script>
Auth.requireLogin('/signin.html');
const user = Auth.getUser() || {};
document.getElementById('navAvatar').textContent = (user.fullName || user.username || 'U').charAt(0).toUpperCase();
document.getElementById('navUsername').textContent = user.username || '';
document.getElementById('navCoins').textContent = 'C.' + (user.coins || 0).toLocaleString('id-ID');

let allIds = [], cartIds = new Set(), activeFilter = 'all', currentPage = 1, totalPages = 1, searchQ = '';
const filters = ['all','low','medium','high','legend'];

async function loadCart(){
  try {
    const res = await UserAPI.getCart();
    if(res && res.success){ cartIds = new Set((res.cart||[]).map(c=>c.idItem)); document.getElementById('cartBadge').textContent = cartIds.size; }
  } catch(e){}
}

async function loadIds(reset=true){
  if(reset){ currentPage=1; allIds=[]; }
  const params = { page: currentPage, limit: 24 };
  if(activeFilter !== 'all') params.tier = activeFilter;
  if(searchQ) params.search = searchQ;
  const res = await IdsAPI.getAll(params);
  if(res && res.success){
    if(reset) allIds = res.ids; else allIds = [...allIds, ...res.ids];
    totalPages = res.totalPages || 1;
    renderGrid();
    document.getElementById('loadMoreBtn').style.display = currentPage < totalPages ? 'block' : 'none';
  }
}

function renderGrid(){
  const grid = document.getElementById('idGrid');
  if(!allIds.length){ grid.innerHTML = '<div class="empty-state">Tidak ada ID ditemukan.</div>'; return; }
  grid.innerHTML = allIds.map(id => {
    const inCart = cartIds.has(id._id.toString());
    const tier = (id.tier || 'low').toLowerCase();
    return `<div class="id-card${id.status==='sold'?' sold':''}" onclick="handleCard('${id._id}','${id.gameId}','${tier}',${id.price})">
      ${id.status==='sold'?'<div class="sold-ribbon">SOLD</div>':''}
      <div class="game-id">${id.gameId}</div>
      <div class="tier-badge tb-${tier}">${tier.charAt(0).toUpperCase()+tier.slice(1)}</div>
      <div class="price">Rp${Number(id.price).toLocaleString('id-ID')}</div>
      ${inCart?'<div style="font-size:.6rem;color:var(--success);margin-top:4px;font-weight:600">✓ Di keranjang</div>':''}
    </div>`;
  }).join('');
}

async function handleCard(idDoc, gameId, tier, price){
  if(cartIds.has(idDoc)){ window.location.href='/user/cart.html'; return; }
  const res = await UserAPI.addToCart(idDoc);
  if(res && res.success){
    cartIds.add(idDoc);
    document.getElementById('cartBadge').textContent = cartIds.size;
    showToast('✅ '+gameId+' ditambah ke keranjang','success');
    renderGrid();
  } else {
    showToast('❌ '+(res?.message||'Gagal menambah ke keranjang'),'error');
  }
}

function renderFilters(){
  const bar = document.getElementById('filterBar');
  bar.innerHTML = filters.map(f=>`<button class="fb${activeFilter===f?' act':''}" data-f="${f}">${f==='all'?'Semua':f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('');
  bar.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{ activeFilter=b.dataset.f; renderFilters(); loadIds(); });
}

document.getElementById('searchInput').addEventListener('input', e=>{ searchQ=e.target.value.trim(); clearTimeout(window._st); window._st=setTimeout(()=>loadIds(),400); });
document.getElementById('loadMoreBtn').addEventListener('click', ()=>{ currentPage++; loadIds(false); });

const drop = document.getElementById('userDropdown');
drop.addEventListener('click',e=>{e.stopPropagation();drop.classList.toggle('active');});
document.addEventListener('click',()=>drop.classList.remove('active'));
document.getElementById('logoutBtn').addEventListener('click',()=>{Auth.clear();window.location.href='/signin.html';});

function initDarkMode(){const btn=document.getElementById('darkModeToggle');let dark=localStorage.getItem('darkMode')==='true';const a=d=>{document.body.classList.toggle('dark-mode',d);btn.textContent=d?'☀️':'🌙';localStorage.setItem('darkMode',d);};a(dark);btn.onclick=()=>{dark=!dark;a(dark);};}
initDarkMode();
renderFilters();
loadCart();
loadIds();
</script>
</body>
</html>
